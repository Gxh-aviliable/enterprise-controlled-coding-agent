[project]
name = "enterprise-agent"
version = "0.1.0"
description = "Controlled engineering agent platform for enterprise intranet deployment"
requires-python = ">=3.11"
dependencies = [
    # Core
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=1.2.1",
    # Vector database
    "chromadb>=0.4.0",
    "sentence-transformers>=2.0.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "redis>=5.0.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.0.0",
    # Utils
    "python-dotenv>=1.0.0",
    "langgraph-checkpoint-redis>=0.4.1",
    "bcrypt<4.1",
    "socksio>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "ruff>=0.1.0",
]

[project.scripts]
serve = "enterprise_agent.api.main:run"

[tool.setuptools.packages.find]
include = ["enterprise_agent*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N"]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.1.0",
]
